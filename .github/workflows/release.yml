name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
      - name: Cross-compile plugin
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ github.event.release.tag_name || github.ref_name }}" -o retouch-afvalwijzer-armv7l .
      - name: Checksums
        run: sha256sum retouch-afvalwijzer-armv7l > SHA256SUMS
      - name: Attach binary + checksums
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            retouch-afvalwijzer-armv7l
            SHA256SUMS
